[experiment]
id = "exp-002-yolo11n-pilot-mps"
kind = "pilot"
hypothesis = "One epoch on full train/val establishes a provisional 640-pixel baseline and checks small-object misses; it does not establish convergence."
seed = 42

[dataset]
root = "data/visdrone/visdrone2019-det/derived/visdrone-yolo-v2"
manifest_sha256 = "39f81c8e209721823f365b377e82b8526e8ef75c2299b40be92f5b599945cf64"
train_images = 0
val_images = 0

[model]
weights = "weights/yolo11n.pt"
weights_sha256 = "0ebbc80d4a7680d14987a577cd21342b65ecfd94632bd9a8da63ae6417644ee1"

[train]
device = "mps"
epochs = 1
imgsz = 640
batch = 8
workers = 0
optimizer = "SGD"
lr0 = 0.01
momentum = 0.937
weight_decay = 0.0005
mosaic = 1.0
close_mosaic = 0

[evaluation]
conf = 0.001
nms_iou = 0.7
max_det = 500
timing_images = 20
warmup = 3
