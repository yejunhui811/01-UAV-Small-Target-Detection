name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validation (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Show execution versions
        run: |
          python --version
          python -m pip --version
          git rev-parse HEAD

      - name: Install and check dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-metrics.txt
          python -m pip check

      - name: Run synthetic tests
        run: python -B -m unittest discover -s tests -v

      - name: Check metadata tests without site packages
        run: python -S -B -m unittest discover -s tests -p test_visdrone_validation.py -v

      - name: Validate repository structure
        run: python -B scripts/validate_structure.py

      - name: Check diff formatting
        run: git diff --check HEAD^ HEAD
